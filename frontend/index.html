<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Light Scheduler</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-lightbulb"></i>
                <h1>MQTT Light Scheduler</h1>
            </div>
        </header>
        
        <div class="card">
            <h2><i class="fas fa-clock"></i> Set Schedule</h2>
            <div class="form-group">
                <label for="onTime">ON Time:</label>
                <i class="fas fa-sun"></i>
                <input type="time" id="onTime" required>
            </div>
            <div class="form-group">
                <label for="offTime">OFF Time:</label>
                <i class="fas fa-moon"></i>
                <input type="time" id="offTime" required>
            </div>
            <button id="submitBtn">
                <i class="fas fa-save"></i>
                Set Schedule
            </button>
            <div id="status" class="status"></div>
        </div>
        
        <div class="card">
            <h2><i class="fas fa-chart-line"></i> Current Status</h2>
            <div class="light-status">
                <div class="light-indicator">
                    <div id="lightIndicator" class="light-off">
                        <i class="fas fa-lightbulb"></i>
                    </div>
                </div>
                <div class="light-info">
                    <h3 id="lightState">Light is OFF</h3>
                    <p>The light will automatically turn on and off according to the schedule.</p>
                </div>
            </div>
            <div class="schedule-info">
                <div class="time-display">
                    <i class="fas fa-sun"></i>
                    <div class="time-info">
                        <div class="time-label">ON Time</div>
                        <div class="time-value" id="currentOnTime">Not set</div>
                    </div>
                </div>
                <div class="time-display">
                    <i class="fas fa-moon"></i>
                    <div class="time-info">
                        <div class="time-label">OFF Time</div>
                        <div class="time-value" id="currentOffTime">Not set</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="connectionStatus" class="connection-status disconnected">
        <i class="fas fa-plug"></i>
        <span>Disconnected</span>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
